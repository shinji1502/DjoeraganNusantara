<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="selfieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFEB"/>
      <stop offset="100%" stop-color="#E7DFD5"/>
    </linearGradient>
    <radialGradient id="faceGrad" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#EEDAC5"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" rx="24" fill="url(#selfieBg)" stroke="#C5A059" stroke-width="4"/>

  <!-- Top bar -->
  <rect x="25" y="25" width="750" height="60" rx="12" fill="#1C1917"/>
  <text x="50" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C5A059" letter-spacing="2">DJOERAGAN NUSANTARA • VERIFIKASI BIOMETRIK KYC</text>

  <!-- Person Silhouette in Center -->
  <!-- Head -->
  <circle cx="360" cy="300" r="100" fill="url(#faceGrad)"/>
  <!-- Hair / Hijab shape -->
  <path d="M260 300 C260 170, 460 170, 460 300 C460 380, 430 400, 360 400 C290 400, 260 380, 260 300 Z" fill="#8C5835" opacity="0.85"/>
  <!-- Body/Shoulders -->
  <path d="M180 620 C180 470, 540 470, 540 620 Z" fill="#44403C"/>

  <!-- Held KTP Card Simulation in Front -->
  <g transform="translate(420, 390) rotate(-6)">
    <rect width="280" height="175" rx="10" fill="#FFFFFF" stroke="#B81D24" stroke-width="3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
    <rect x="10" y="10" width="260" height="30" rx="6" fill="#1C1917"/>
    <text x="20" y="30" font-family="sans-serif" font-size="9" font-weight="bold" fill="#C5A059">REPUBLIK INDONESIA - KTP</text>
    <rect x="15" y="55" width="60" height="75" rx="6" fill="#E7DFD5" stroke="#8C5835"/>
    <text x="90" y="70" font-family="monospace" font-size="9" font-weight="bold" fill="#B81D24">NIK: 3372015509820003</text>
    <text x="90" y="90" font-family="sans-serif" font-size="8" fill="#1C1917">Nama: ENDANG PURWANTI</text>
    <text x="90" y="105" font-family="sans-serif" font-size="8" fill="#1C1917">KTP Asli Terbaca Jelas</text>
  </g>

  <!-- Checkmark Badge -->
  <circle cx="400" cy="670" r="40" fill="#10B981"/>
  <path d="M382 670 L395 683 L420 655" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="735" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">Wajah &amp; KTP Terbaca Jelas</text>

  <!-- Big Watermark -->
  <g transform="translate(400, 380) rotate(-20)">
    <rect x="-270" y="-40" width="540" height="80" rx="14" fill="#B81D24" opacity="0.12" stroke="#B81D24" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="0" y="12" font-family="sans-serif" font-size="28" font-weight="900" fill="#B81D24" opacity="0.55" text-anchor="middle" letter-spacing="3">CONTOH - SELFIE KTP (DUMMY)</text>
  </g>

  <!-- Footer notice -->
  <rect x="25" y="750" width="750" height="30" rx="6" fill="#F5EFEB"/>
  <text x="400" y="770" font-family="sans-serif" font-size="11" fill="#78716C" text-anchor="middle">Dokumen contoh simulasi sistem Djoeragan Nusantara • Bukan foto asli pendaftar</text>
</svg>